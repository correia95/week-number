    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What week number is it right now?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The big number at the top is the current ISO 8601 week. ISO weeks start on Monday and week 1 is the week containing the year's first Thursday."
            }
          },
          {
            "@type": "Question",
            "name": "How is ISO week 1 defined?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Week 1 is the first week with most of its days in the new year — the week that contains 4 January, or equivalently the year's first Thursday. So early January can fall in week 52 or 53 of the previous year."
            }
          },
          {
            "@type": "Question",
            "name": "Why do some years have 53 weeks?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A year has 53 ISO weeks when 1 January is a Thursday, or a Wednesday in a leap year. Otherwise it has 52. 2020 and 2026 are 53-week years."
            }
          },
          {
            "@type": "Question",
            "name": "Is the US week number different?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Often, yes. North American calendars start weeks on Sunday and call the week with 1 January week 1, with no Thursday rule, so the number can differ from ISO by one. Both are shown."
            }
          }
        ]
      }
    </script>
